<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duitsland Agent — Meistersaft</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c2b24;
    --paper:#f6f4ee;
    --line:#d8d2c2;
    --moss:#3f5d45;
    --moss-dark:#2c4432;
    --amber:#c47b2c;
    --danger:#a6402f;
    --ok:#3f5d45;
    --muted:#7a7568;
    --card:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .brandbar{
    background:var(--moss-dark);
    color:#fff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:600;
    letter-spacing:.02em;
  }
  .brandbar .tag{
    font-size:12px;
    font-weight:400;
    opacity:.75;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  #login-screen{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:calc(100vh - 54px);
    padding:20px;
  }
  .login-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px;
    width:100%;
    max-width:360px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  .login-card h1{
    font-size:19px;
    margin:0 0 6px;
  }
  .login-card p.sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 22px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:5px;
  }
  input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:15px;
    margin-bottom:16px;
    background:#fff;
  }
  input:focus{outline:2px solid var(--moss); outline-offset:1px;}
  button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:7px;
    background:var(--moss);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{background:var(--moss-dark);}
  button:disabled{opacity:.5; cursor:default;}
  #login-error{
    color:var(--danger);
    font-size:13px;
    margin:-6px 0 14px;
    display:none;
  }
  #app-screen{display:none;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:10px 20px;
  }
  .who{font-size:13px; color:var(--muted);}
  .who b{color:var(--ink);}
  .signout{
    width:auto;
    padding:7px 14px;
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
    font-weight:500;
    font-size:13px;
  }
  .signout:hover{background:var(--paper); color:var(--ink);}
  nav.tabs{
    display:flex;
    gap:4px;
    padding:10px 20px 0;
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button.tab{
    width:auto;
    background:transparent;
    color:var(--muted);
    font-weight:600;
    font-size:14px;
    padding:10px 14px;
    border-radius:0;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.tab.active{
    color:var(--moss-dark);
    border-bottom:2px solid var(--moss);
  }
  main{padding:20px; max-width:1100px; margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
    align-items:center;
  }
  .toolbar input[type=search]{
    max-width:280px;
    margin-bottom:0;
  }
  select{
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:14px;
    background:#fff;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  th, td{
    text-align:left;
    padding:9px 12px;
    font-size:13.5px;
    border-bottom:1px solid var(--line);
  }
  th{
    background:var(--paper);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--muted);
  }
  tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-block;
    padding:2px 9px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
  }
  .badge.active{background:#e5efe6; color:var(--ok);}
  .badge.lost{background:#f5e3df; color:var(--danger);}
  .badge.prospect{background:#f0e8d4; color:var(--amber);}
  .count{color:var(--muted); font-size:13px; margin-bottom:10px;}
  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:12px;
  }
  .visit-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .visit-card h3{margin:0 0 4px; font-size:15px;}
  .visit-card .meta{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  .visit-card .status{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:2px 8px;
    border-radius:999px;
    background:var(--paper);
    color:var(--moss-dark);
  }
  @media (max-width:640px){
    main{padding:12px;}
    nav.tabs{padding:8px 10px 0; overflow-x:auto;}
    table{font-size:12px;}
    th, td{padding:7px 8px;}
  }

  .visit-card{cursor:pointer; transition:box-shadow .12s;}
  .visit-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(28,43,36,.45);
    z-index:50;
    align-items:flex-start;
    justify-content:center;
    padding:24px 12px;
    overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff;
    border-radius:var(--radius);
    width:100%;
    max-width:560px;
    max-height:calc(100vh - 48px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .modal-head h2{margin:0; font-size:17px;}
  .modal-close{
    width:auto;
    background:transparent;
    color:var(--muted);
    font-size:22px;
    line-height:1;
    padding:0 4px;
  }
  .modal-close:hover{background:transparent; color:var(--ink);}
  .modal-body{
    padding:16px 18px;
    overflow-y:auto;
  }
  .modal-body h3{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--muted);
    margin:18px 0 8px;
  }
  .modal-body h3:first-of-type{margin-top:4px;}
  .vm-meta{
    font-size:13.5px;
    color:var(--muted);
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .mhd-row{
    display:grid;
    grid-template-columns:1fr 90px 110px;
    gap:8px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .mhd-row:last-child{border-bottom:none;}
  .mhd-row .mhd-name{font-weight:600;}
  .mhd-row .mhd-sub{font-size:12px; color:var(--muted); font-weight:400;}
  .mhd-row input[type=number]{
    width:100%;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:13.5px;
    margin:0;
  }
  .mhd-row select{
    width:100%;
    padding:6px 6px;
    font-size:13px;
  }
  .doc-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .doc-row:last-child{border-bottom:none;}
  .doc-row select{width:120px;}
  textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:14px;
    font-family:inherit;
    resize:vertical;
  }
  .modal-foot{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 18px;
    border-top:1px solid var(--line);
  }
  .modal-foot button{width:auto; padding:9px 16px; font-size:14px;}
  .modal-foot button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .modal-foot button.secondary:hover{background:var(--paper);}
  .vm-hint{font-size:12.5px; color:var(--muted); flex:1;}
  .vm-hint.ok{color:var(--ok);}
  .vm-hint.err{color:var(--danger);}
  #vm-photo-input{
    font-size:13px;
    padding:6px 0;
  }

  tr.customer-row{cursor:pointer;}
  tr.customer-row:hover{background:var(--paper);}

  .history-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .h-date{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .history-item .h-line{margin-top:3px;}
  .history-item .h-label{color:var(--muted);}
  .add-form{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .add-form input, .add-form textarea, .add-form select{
    margin-bottom:0;
  }
  .add-form button{align-self:flex-start;}
</style>
</head>
<body>

<div class="brandbar">
  <span>Flevosap · Duitsland Agent</span>
  <span class="tag">Meistersaft</span>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>Inloggen</h1>
    <p class="sub">Toegang voor Wyno, Kasia en Normen.</p>
    <div id="login-error"></div>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="naam@flevosap.nl">
    <label for="password">Wachtwoord</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <button id="login-btn">Inloggen</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <div class="who">Ingelogd als <b id="who-email">—</b> · rol: <b id="who-role">—</b></div>
    <button class="signout" id="signout-btn">Uitloggen</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-panel="panel-customers">Klanten</button>
    <button class="tab" data-panel="panel-visits">Bezoeken</button>
    <button class="tab" data-panel="panel-calls">Telefoontaken</button>
  </nav>

  <main>
    <section id="panel-customers" class="panel active">
      <div class="toolbar">
        <input type="search" id="cust-search" placeholder="Zoek op naam of plaats…">
        <select id="cust-status">
          <option value="">Alle statussen</option>
          <option value="active">Actief</option>
          <option value="lost">Verloren</option>
          <option value="prospect">Prospect</option>
        </select>
      </div>
      <div class="count" id="cust-count"></div>
      <div id="cust-table-wrap"><div class="empty">Bezig met laden…</div></div>
    </section>

    <section id="panel-visits" class="panel">
      <div class="toolbar">
        <input type="date" id="visit-date">
        <button style="width:auto; padding:8px 14px;" id="visit-today-btn">Vandaag</button>
      </div>
      <div class="count" id="visit-count"></div>
      <div class="card-grid" id="visit-cards"><div class="empty">Bezig met laden…</div></div>
    </section>

    <section id="panel-calls" class="panel">
      <div class="count" id="call-count"></div>
      <div id="call-table-wrap"><div class="empty">Bezig met laden…</div></div>
    </section>
  </main>
</div>

<!-- BEZOEK AFRONDEN MODAL -->
<div id="visit-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="vm-title">Bezoek</h2>
      <button class="modal-close" id="vm-close">×</button>
    </div>
    <div class="modal-body">
      <div id="vm-meta" class="vm-meta"></div>

      <h3>Bestand &amp; MHD per product</h3>
      <div id="vm-mhd-list"></div>

      <h3>Belegen</h3>
      <div id="vm-docs"></div>

      <h3>Foto</h3>
      <input type="file" id="vm-photo-input" accept="image/*" capture="environment">
      <div id="vm-photo-status" class="vm-hint"></div>

      <h3>Opmerking</h3>
      <textarea id="vm-notitie" rows="2" placeholder="Eventuele opmerking over dit bezoek…"></textarea>
    </div>
    <div class="modal-foot">
      <div id="vm-save-status" class="vm-hint"></div>
      <button class="secondary" id="vm-save-btn">Opslaan</button>
      <button id="vm-complete-btn">Bezoek afronden</button>
    </div>
  </div>
</div>

<!-- KLANTENKAART MODAL -->
<div id="customer-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="cm-title">Klant</h2>
      <button class="modal-close" id="cm-close">×</button>
    </div>
    <div class="modal-body">
      <div id="cm-meta" class="vm-meta"></div>

      <h3>Contactgeschiedenis</h3>
      <div id="cm-contacts-list"></div>
      <div class="add-form">
        <select id="cm-contact-soort">
          <option value="telefoon">Telefoon</option>
          <option value="bezoek">Bezoek</option>
          <option value="e-mail">E-mail</option>
          <option value="overig">Overig</option>
        </select>
        <textarea id="cm-contact-besproken" rows="2" placeholder="Wat is besproken?"></textarea>
        <textarea id="cm-contact-te-bespreken" rows="2" placeholder="Wat moet nog besproken worden (volgende keer)?"></textarea>
        <button class="secondary" id="cm-contact-add-btn">Contactmoment toevoegen</button>
      </div>

      <h3>Bestelgeschiedenis</h3>
      <div id="cm-orders-list"></div>
      <div class="add-form">
        <input type="text" id="cm-order-artikel" placeholder="Artikel">
        <input type="text" id="cm-order-hoeveelheid" placeholder="Hoeveelheid (bv. 8 dozen)">
        <textarea id="cm-order-opmerking" rows="1" placeholder="Opmerking (optioneel)"></textarea>
        <button class="secondary" id="cm-order-add-btn">Bestelling toevoegen</button>
      </div>
    </div>
    <div class="modal-foot">
      <div id="cm-save-status" class="vm-hint"></div>
      <button class="secondary" id="cm-close-btn">Sluiten</button>
    </div>
  </div>
</div>

<script src="app.js"></script>


</body>
</html>
